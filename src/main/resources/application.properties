server.port=0

# Token lifetimes and per-caller rate limit (sliding window).
auth.security.access-token-ttl-millis=300000
auth.security.refresh-token-ttl-millis=3600000
auth.security.rate-limit-max-requests=5
auth.security.rate-limit-window-millis=1000
# Benign-concurrency overlap window for concurrent refresh attempts (see README §2.3).
auth.security.refresh-concurrent-overlap-millis=2000
