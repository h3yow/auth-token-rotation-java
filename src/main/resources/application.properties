server.port=0

# Token lifetimes and per-caller rate limit (sliding window).
auth.security.access-token-ttl-millis=300000
auth.security.refresh-token-ttl-millis=3600000
auth.security.rate-limit-max-requests=5
auth.security.rate-limit-window-millis=1000

# Benign-concurrency grace window for refresh: a reuse of a just-rotated
# refresh token is classified as a scheduling-independent concurrent conflict
# (HTTP 409) instead of a sequential replay while the successor stays ACTIVE.
auth.security.refresh-concurrent-grace-millis=30000

# Controlled state reclamation. The manual endpoint is always available at
# POST /internal/maintenance/purge; the background scheduler is opt-in.
auth.reclamation.schedule-enabled=false
auth.reclamation.sweep-interval-millis=60000
